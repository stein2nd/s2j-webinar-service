name: Release

env:
  PHP_VERSION: "8.3"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP quality (release gate)
        run: bash scripts/verify/all.sh

  packagist-update:
    needs: php-quality
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist metadata update
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_USERNAME:-}" ] || [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "PACKAGIST_USERNAME / PACKAGIST_TOKEN not set; skipping API update."
            echo "If GitHub auto-update is enabled on packagist.org, the tag push is enough."
            exit 0
          fi
          curl -fsS -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/stein2nd/s2j-webinar-service"}}'
